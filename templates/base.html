{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Restaurant Booking{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'restaurants:restaurant_detail' %}">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'user_bookings' %}">My Bookings</a>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'accounts:register' %}">Register</a>  {# Проверьте имя URL #}
            <a href="{% url 'accounts:login' %}">Login</a>  {# Проверьте имя URL #}
        {% endif %}
        {% if user.is_staff %}
            <a href="{% url 'restaurants:restaurant_create' %}">Add Restaurant</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}
    {% endblock %}
</body>
</html>
